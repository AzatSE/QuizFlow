databases:
  - name: minikahoot-db
    plan: free
    databaseName: minikahoot
    user: minikahoot

services:
  - type: web
    name: minikahoot
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn config.wsgi:application --workers 1 --threads 8 --access-logfile -"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: minikahoot-db
          property: connectionString
