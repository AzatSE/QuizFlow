{% extends "game/base.html" %}
{% block content %}
<section class="card center join-card">
  <p class="eyebrow">Подключение к комнате</p>
  <h1>Влетаем в игру</h1>
  <p class="muted">PIN <span class="mono">{{ pin }}</span></p>
  {% if error %}<p class="err">{{ error }}</p>
  {% else %}
  <form method="post">{% csrf_token %}
    <label for="nickname">Как тебя называть?</label>
    <input id="nickname" name="nickname" maxlength="20" placeholder="Твой ник" class="big" autocomplete="off" required autofocus>
    {{ form.nickname.errors }}
    <button class="btn">Войти в игру <span aria-hidden="true">→</span></button>
  </form>{% endif %}
</section>
{% endblock %}
