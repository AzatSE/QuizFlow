{% extends "game/base.html" %}
{% block content %}
<section class="card">
  <p class="eyebrow">Панель ведущего</p>
  <div class="section-head"><h1>Мои квизы</h1><span class="badge">Космическая коллекция</span></div>
  <div>
  {% for q in quizzes %}
    <div class="quiz-row"><a href="{% url 'quiz_detail' q.pk %}">{{ q.title }}</a>
      <form method="post" action="{% url 'quiz_delete' q.pk %}" class="inline">{% csrf_token %}<button class="link danger-text">Удалить</button></form></div>
  {% empty %}<p class="muted">Коллекция пока пуста — создай первый квиз.</p>{% endfor %}
  </div>
  <h2>Создать новую викторину</h2>
  <form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn">Создать</button></form>
</section>
{% endblock %}
